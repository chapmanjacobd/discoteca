name: CI

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

permissions: {}

env:
  GO_VERSION: '1.27.3'
  NODE_VERSION: '26'

jobs:
  ci:
    name: Continuous Integration
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    env:
      BUILD_TAGS: fts5
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json

      - name: Install system dependencies
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            make ubuntu-deps
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            make macos-deps
          elif [ "${{ matrix.os }}" = "windows-latest" ]; then
            choco install sqlite ffmpeg --no-progress --stop-on-first-failure
          fi

      - name: Install Go and Web dependencies
        run: |
          make go-deps
          make web-install

      - name: Run checks and build
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            # Windows often has issues with parallel tests and file locking on SQLite DBs
            gotestsum --format github-actions -- ./... -tags "${BUILD_TAGS}" -parallel 1
            make all
          else
            make all
          fi

      - name: Run race detector
        if: matrix.os == 'ubuntu-latest'
        run: make test-race

      - name: Install E2E dependencies
        if: matrix.os == 'ubuntu-latest'
        run: make e2e-install

      - name: Run Playwright tests
        if: matrix.os == 'ubuntu-latest'
        run: make e2e
        env:
          DISCO_BINARY: ${{ github.workspace }}/disco
          DISCO_BASE_URL: http://localhost:8080
          CI: true

      - name: Upload test results
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/test-results/
          retention-days: 7

      - name: Upload HTML report
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-html-report
          path: e2e/playwright-report/
          retention-days: 7

  # Release builds only run after every CI matrix leg succeeds on a tag.
  build-release:
    name: Build release binaries (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      BUILD_TAGS: fts5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: make web-install

      - name: Install the Linux arm64 cross compiler
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Build Linux binaries (amd64 and arm64)
        if: matrix.os == 'ubuntu-latest'
        run: |
          make release-build GOOS=linux GOARCH=amd64
          make release-build GOOS=linux GOARCH=arm64 CC=aarch64-linux-gnu-gcc

      - name: Build macOS binaries (amd64 and arm64)
        if: matrix.os == 'macos-latest'
        run: |
          make release-build GOOS=darwin GOARCH=amd64
          make release-build GOOS=darwin GOARCH=arm64

      - name: Build Windows binary (amd64)
        if: matrix.os == 'windows-latest'
        run: make release-build GOOS=windows GOARCH=amd64

      - name: Upload built binaries
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: dist/disco-*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built binaries
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Write SHA-256 checksums
        run: |
          cd dist
          for f in disco-*; do
            case "$f" in
              *.sha256) continue ;;
            esac
            sha256sum "$f" > "$f.sha256"
          done

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --latest
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "discoteca $GITHUB_REF_NAME" \
              --generate-notes \
              --latest
          fi

      - name: Upload binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/disco-* --repo "$GITHUB_REPOSITORY" --clobber
